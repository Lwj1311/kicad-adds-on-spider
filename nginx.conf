server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index repository.json;

    # Enable gzip for JSON (KiCad clients benefit a lot)
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Set reasonable cache for static zip files
    location ~* \.zip$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # JSON metadata should be revalidated more often
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Prevent directory listing — KiCad doesn't need it
    autoindex off;
}
